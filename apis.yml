aid: fitetv
name: Fitetv
description: >-
  FITE (fite.tv) is a live sports and entertainment streaming platform that now
  operates as TrillerTV, run by Flipps Media Inc., a Triller Group Inc company.
  The service specializes in combat sports and alternative entertainment,
  streaming boxing, bare-knuckle fighting (BKFC), MMA, kickboxing, professional
  wrestling, cricket (via the Willow by Cricbuzz channel), soccer, cycling, and
  motorsports. It advertises thousands of hours of free video, more than a
  thousand live events per year, and a multi-million-strong fan community, with
  content delivered through free tiers, the TrillerTV+ subscription, and
  pay-per-view events across web, mobile, and connected-TV apps. This API
  Evangelist profile tracks the company's public web surface; no public
  developer API or documentation program has been located.
